# Seed source registry. This is a starting point — the system adds discovered
# sources to the database itself. Every URL below was verified live on 2026-10-02.
#
# tier:  A official (gov / military / NATO / intelligence)   B wire agency
#        C quality international media   D local / regional media
#        E think tank (stored as ASSESSMENT/ANALYSIS)   F OSINT researchers
#        G social / unverified   S state-controlled media of a party
# side:  nato | ru | by | ua | neutral  — whose position the source primarily carries
# reliability: prior 0..1, adjusted over time by the feedback loop
# focused: true = topic-specific source, every item goes to AI triage;
#          false = general source, items must pass the keyword pre-filter first
#
# kinds: rss | telegram (public channel via t.me/s/) | web (list page + linkPattern)
#        gdelt (GDELT DOC API query) | bluesky (public author feed)

defaults:
  A: { reliability: 0.9, focused: true }
  B: { reliability: 0.9, focused: false }
  C: { reliability: 0.8, focused: false }
  D: { reliability: 0.75, focused: false }
  E: { reliability: 0.75, focused: true }
  F: { reliability: 0.65, focused: true }
  G: { reliability: 0.4, focused: true }
  S: { reliability: 0.5, focused: false }

sources:
